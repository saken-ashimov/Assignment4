<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 — Book a Train Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/task1.css">
</head>
<body class="py-4 py-md-5">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8 col-xl-7">

        <div class="card ticket-card">
          <!-- Card Header -->
          <div class="ticket-card-header px-4 py-3 py-md-4">
            <h1 class="h4 fw-bold mb-0">Book a train ticket</h1>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4">
            <form action="#" method="get">

              <!-- Row 1: One way / Round trip (Radio toggle buttons) -->
              <div class="mb-3">
                <div class="btn-group rounded-pill trip-toggle-group" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="tripType" id="oneWay" value="one-way" checked required>
                  <label class="btn rounded-pill px-3 py-1" for="oneWay">One way</label>

                  <input type="radio" class="btn-check" name="tripType" id="roundTrip" value="round-trip" required>
                  <label class="btn rounded-pill px-3 py-1" for="roundTrip">Round trip</label>
                </div>
              </div>

              <!-- Row 2: From & To -->
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="fromCity" name="from" placeholder="Astana" value="Astana" required>
                    <label for="fromCity">From</label>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="toCity" name="to" placeholder="Almaty" value="Almaty" required>
                    <label for="toCity">To</label>
                  </div>
                </div>
              </div>

              <!-- Row 3: Departure, Return, Passengers -->
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-4">
                  <label for="departureDate" class="form-label">Departure</label>
                  <input type="date" class="form-control" id="departureDate" name="departure" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="returnDate" class="form-label">Return</label>
                  <input type="date" class="form-control" id="returnDate" name="return">
                </div>
                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label">Passengers</label>
                  <select class="form-select" id="passengers" name="passengers" required>
                    <option value="1" selected>1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>
              </div>

              <!-- Row 4: Carriage class (Inline radio buttons) -->
              <fieldset class="mb-3">
                <legend class="col-form-label pt-0 mb-1">Carriage class</legend>
                <div class="d-flex flex-wrap gap-3">
                  <div class="form-check form-check-inline me-0">
                    <input class="form-check-input" type="radio" name="carriageClass" id="classSeat" value="seat" required>
                    <label class="form-check-label" for="classSeat">Seat</label>
                  </div>
                  <div class="form-check form-check-inline me-0">
                    <input class="form-check-input" type="radio" name="carriageClass" id="classCoupe" value="coupe" checked required>
                    <label class="form-check-label" for="classCoupe">Coupé</label>
                  </div>
                  <div class="form-check form-check-inline me-0">
                    <input class="form-check-input" type="radio" name="carriageClass" id="classSleeper" value="sleeper" required>
                    <label class="form-check-label" for="classSleeper">Sleeper</label>
                  </div>
                </div>
              </fieldset>

              <!-- Row 5: Phone (Input group) & Email -->
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">Phone</label>
                  <div class="input-group">
                    <span class="input-group-text phone-prefix" id="phoneAddon">+7</span>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" aria-describedby="phoneAddon" required>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
              </div>

              <!-- Row 6: SMS Switch -->
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="smsSwitch" name="sendSms">
                <label class="form-check-label" for="smsSwitch">Also send the ticket by SMS</label>
              </div>

              <!-- Row 7: Carriage Rules Checkbox -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="agreeRules" name="agreeRules" required>
                <label class="form-check-label" for="agreeRules">I agree with the carriage rules</label>
              </div>

              <!-- Row 8: Buttons (Clear & Find trains) -->
              <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
                <button type="reset" class="btn btn-clear rounded-pill px-4 py-2">Clear</button>
                <button type="submit" class="btn btn-find rounded-pill px-4 py-2">Find trains</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
